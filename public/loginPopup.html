<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Login Popup</title>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");

      if (code) {
        window.opener.postMessage({ type: "kakao-auth-code", code }, "*");
        window.close();
      } else {
        document.body.innerHTML = "<h1>인가 코드가 없습니다.</h1>";
      }
    </script>
  </body>
</html>
